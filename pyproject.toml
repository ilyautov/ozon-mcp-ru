[project]
name = "ozon-mcp-ru"
version = "0.5.4"
description = "API Ozon Seller для ИИ-ассистентов: товары, заказы FBS и FBO, цены, остатки, финансы, отзывы"
keywords = ["mcp", "model-context-protocol", "ozon", "ozon-api", "ozon-seller", "озон", "seller-api", "marketplace", "ecommerce", "russia", "claude"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ilya Utov" }]
dependencies = [
    # Весь код приходит отсюда. Версия фиксируется снизу и держится в пределах
    # мажорной: обёртка обязана ставить то ядро, про которое написан README.
    "marketplaces-mcp-ru>=0.5.3,<1",
]

[project.urls]
Homepage = "https://marketplaces-mcp-ru.aifrontier.tech/ozon-api.html"
Documentation = "https://marketplaces-mcp-ru.aifrontier.tech/ozon-api.html"
Repository = "https://github.com/ilyautov/ozon-mcp-ru"
Issues = "https://github.com/ilyautov/ozon-mcp-ru/issues"
Changelog = "https://github.com/ilyautov/ozon-mcp-ru/blob/main/CHANGELOG.md"

[project.scripts]
ozon-mcp-ru = "ozon_mcp_ru:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ozon_mcp_ru"]
